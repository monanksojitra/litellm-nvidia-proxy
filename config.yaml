# ============================================================================
# GENERAL SECURITY & PROXY CONFIGURATION
# ============================================================================
general_settings:
  # Master key for proxy authentication - set via LITELLM_MASTER_KEY env var
  master_key: os.environ/LITELLM_MASTER_KEY

  # Unauthenticated public endpoints for health checks
  public_routes:
    - "/health/liveliness"
    - "/health/readiness"

  background_health_checks: false
  token_rate_limit_type: "total"

# ============================================================================
# ROUTER, LOAD BALANCING & ALIASES
# ============================================================================
router_settings:
  # Multi-provider load balancing
  routing_strategy: "least-busy"

  # Enforce model-level rate limits
  optional_pre_call_checks:
    - enforce_model_rate_limits

  # Retry policy for transient upstream network or rate-limit issues
  retry_policy:
    max_retries: 2
    retry_on_status_codes:
      - 429
      - 500
      - 502
      - 503
      - 504

  # Model aliases: Translate Claude Code & framework calls to free pools
  model_group_alias:
    # --- Claude Code CLI Mappings ---
    "claude-3-7-sonnet-20250219": "free-coding"
    "claude-3-5-sonnet-20241022": "free-coding"
    "claude-3-5-sonnet-latest": "free-coding"
    "claude-3-5-haiku-20241022": "free-fast"
    "claude-3-5-haiku-latest": "free-fast"
    "claude-3-opus-20240229": "free-reasoning"
    "claude-3-opus-latest": "free-reasoning"

    # --- Multi-Agent Framework Roles ---
    "agent-coder": "free-coding"
    "agent-planner": "free-reasoning"
    "agent-reviewer": "free-fast"
    "agent-architect": "free-reasoning"
    "agent-tester": "free-fast"

    # --- Common Model Aliases ---
    "gpt-4o": "free-coding"
    "gpt-4": "free-coding"
    "codestral": "mistral-codestral"
    "glm-4-flash": "zhipu-glm-4-flash"
    "nvidia-coding": "free-coding"

  # Automatic multi-tier fallback chains
  fallbacks:
    - "free-coding": ["free-reasoning", "free-fast", "free-auto"]
    - "free-reasoning": ["free-coding", "free-auto"]
    - "free-fast": ["free-coding", "free-auto"]
    - "free-auto": ["free-fast"]
    - "nvidia-nemotron": ["nvidia-llama-70b", "free-coding", "pollinations-qwen-coder"]
    - "nvidia-deepseek-r1": ["free-reasoning", "pollinations-deepseek-r1"]
    - "openrouter-qwen-coder": ["nvidia-nemotron", "free-coding", "pollinations-qwen-coder"]
    - "openrouter-deepseek-r1": ["nvidia-deepseek-r1", "free-reasoning", "pollinations-deepseek-r1"]

# ============================================================================
# LITELLM SYSTEM SETTINGS
# ============================================================================
litellm_settings:
  # Drop unsupported vendor parameters (e.g. Anthropic specific headers) gracefully
  drop_params: true
  request_timeout: 120
  telemetry: false
