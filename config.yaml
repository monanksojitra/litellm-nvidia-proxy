# LiteLLM Proxy Configuration for Free Multi-Provider LLMs (NVIDIA NIM Primary + 33 Providers)
# Designed for Claude Code CLI, Cursor, Cline, OpenCode, and Multi-Agent Frameworks
# Primary Engine: NVIDIA NIM API (Free 1,000 Credits)
# Keyless Resilient Fallback: Pollinations AI (Zero Setup / Zero Key)
# All API keys are loaded securely from environment variables.
# NEVER commit actual secrets or keys to this repository.

