# LiteLLM Proxy Configuration for Multi-Provider Free LLMs (33 Providers)
# Inspired by OmniRoute: Quota-Aware Multi-Agent Role Pools & Resilient Fallbacks
# Supports Single-Agent (Claude Code) and Multi-Agent Parallel Coding Workflows (AutoGen, CrewAI, LangGraph, Cursor, Cline)
# All API keys must be provided via environment variables.
# NEVER commit actual secrets or keys to this repository.

model_list:
  # ============================================================================
  # 1. MULTI-AGENT ROLE POOLS & GENERAL CODING POOLS
  # ============================================================================

  # --- POOL A: agent-coder / free-coding (Primary Pool for Code Generation & Tool Calls) ---
  # Google AI Studio (Gemini 2.5 Flash - 15 RPM / 1M TPM / 1M Context)
  - model_name: free-coding
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 15
      tpm: 1000000
      request_timeout: 120

  # Mistral AI (Codestral - 1 Billion Free Tokens/Mo Grant)
  - model_name: free-coding
