# LiteLLM Proxy Configuration - OpenRouter + Keyless Fallbacks Only
# Works with just OPENROUTER_API_KEY + Pollinations (no API key needed)
# NEVER commit actual secrets or keys to this repository.

model_list:
  # ============================================================================
  # 1. OPENROUTER PROVIDERS (uses OPENROUTER_API_KEY)
  # ============================================================================

  # --- POOL A: agent-coder / free-coding (Code Generation & Tool Calls) ---
  # OpenRouter Free Models
  - model_name: free-coding
    litellm_params:
      model: openrouter/qwen/qwen-2.5-coder-32b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 120

  - model_name: free-coding
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 120

  - model_name: free-coding
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-exp:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 120

  - model_name: free-coding
    litellm_params:
      model: openrouter/mistralai/mistral-small-3.1-24b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 120

  - model_name: free-coding
    litellm_params:
      model: openrouter/nousresearch/hermes-3-llama-3.1-405b:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 120

  # --- POOL B: agent-planner / free-reasoning (Deep Architecture & Reasoning) ---
  - model_name: free-reasoning
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 180

  - model_name: free-reasoning
    litellm_params:
      model: openrouter/deepseek/deepseek-r1-distill-llama-70b:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 180

  - model_name: free-reasoning
    litellm_params:
      model: openrouter/qwen/qwq-32b:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 180

  - model_name: free-reasoning
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-thinking-exp:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 180

  # --- POOL C: agent-reviewer / free-fast (High Throughput, Low Latency) ---
  - model_name: free-fast
    litellm_params:
      model: openrouter/qwen/qwen-2.5-coder-32b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 60

  - model_name: free-fast
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-8b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 60

  - model_name: free-fast
    litellm_params:
      model: openrouter/google/gemma-2-9b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 60

  - model_name: free-fast
    litellm_params:
      model: openrouter/microsoft/phi-3.5-mini-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 60

  # --- POOL D: free-auto (OpenRouter Auto Router) ---
  - model_name: free-auto
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20
      request_timeout: 120

  # ============================================================================
  # 2. KEYLESS PROVIDERS (Pollinations - No API Key Required)
  # ============================================================================

  # Pollinations AI - 100% Free & Keyless (works without api_key)
  # These serve as ultimate fallbacks when OpenRouter is rate limited
  - model_name: free-coding
    litellm_params:
      model: openai/qwen-coder
      api_base: https://text.pollinations.ai/openai
      api_key: "pollinations-keyless"  # Dummy key - Pollinations doesn't require real key
      request_timeout: 120

  - model_name: free-reasoning
    litellm_params:
      model: openai/deepseek-r1
      api_base: https://text.pollinations.ai/openai
      api_key: "pollinations-keyless"
      request_timeout: 180

  - model_name: free-fast
    litellm_params:
      model: openai/qwen-coder
      api_base: https://text.pollinations.ai/openai
      api_key: "pollinations-keyless"
      request_timeout: 60

  - model_name: free-auto
    litellm_params:
      model: openai/claude-hybrid
      api_base: https://text.pollinations.ai/openai
      api_key: "pollinations-keyless"
      request_timeout: 120

  # ============================================================================
  # 3. DIRECT INDIVIDUAL MODEL TARGETS (OpenRouter Only)
  # ============================================================================

  # OpenRouter Direct Models
  - model_name: openrouter-qwen-coder
    litellm_params:
      model: openrouter/qwen/qwen-2.5-coder-32b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-llama-70b
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-gemini-flash
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-exp:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-deepseek-r1
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-qwq
    litellm_params:
      model: openrouter/qwen/qwq-32b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-hermes-405b
    litellm_params:
      model: openrouter/nousresearch/hermes-3-llama-3.1-405b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-mistral-small
    litellm_params:
      model: openrouter/mistralai/mistral-small-3.1-24b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-llama-8b
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-8b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-gemma-9b
    litellm_params:
      model: openrouter/google/gemma-2-9b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-phi-3.5
    litellm_params:
      model: openrouter/microsoft/phi-3.5-mini-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-auto-free
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

  # Pollinations Direct (Keyless)
  - model_name: pollinations-qwen-coder
    litellm_params:
      model: openai/qwen-coder
      api_base: https://text.pollinations.ai/openai
      api_key: "pollinations-keyless"

  - model_name: pollinations-deepseek-r1
    litellm_params:
      model: openai/deepseek-r1
      api_base: https://text.pollinations.ai/openai
      api_key: "pollinations-keyless"

  - model_name: pollinations-claude-hybrid
    litellm_params:
      model: openai/claude-hybrid
      api_base: https://text.pollinations.ai/openai
      api_key: "pollinations-keyless"

general_settings:
  # Master key for proxy authentication - MUST be set via LITELLM_MASTER_KEY env var
  master_key: os.environ/LITELLM_MASTER_KEY

  # Only allow authenticated requests to completion endpoints
  public_routes:
    - "/health/liveliness"
    - "/health/readiness"

  background_health_checks: false
  token_rate_limit_type: "total"

router_settings:
  # Multi-Agent Load balancing across identical model deployments
  routing_strategy: "least-busy"

  # Enforce model-level rate limits
  optional_pre_call_checks:
    - enforce_model_rate_limits

  # Retry policy for transient errors before switching to fallback provider
  retry_policy:
    max_retries: 2
    retry_on_status_codes:
      - 429
      - 500
      - 502
      - 503
      - 504

  # Model aliases for Claude Code and Multi-Agent frameworks
  model_group_alias:
    # Claude Code Default Mappings
    "claude-3-5-sonnet-20241022": "free-coding"
    "claude-3-7-sonnet-20250219": "free-coding"
    "claude-3-5-haiku-20241022": "free-fast"
    "claude-3-opus-20240229": "free-reasoning"

    # Multi-Agent Framework Roles
    "agent-coder": "free-coding"
    "agent-planner": "free-reasoning"
    "agent-reviewer": "free-fast"
    "agent-architect": "free-reasoning"
    "agent-tester": "free-fast"

    # Common Model Group Aliases
    "gpt-4o": "openrouter-llama-70b"
    "gpt-4": "free-coding"
    "deepseek-r1": "free-reasoning"
    "deepseek-v3": "free-coding"
    "qwen-2.5-coder": "free-coding"
    "codestral": "openrouter-mistral-small"
    "glm-4-flash": "openrouter-gemini-flash"

  # Simplified Fallback Chains - Only OpenRouter + Pollinations (keyless)
  fallbacks:
    - "free-coding": ["free-reasoning", "free-fast", "free-auto"]
    - "free-reasoning": ["free-coding", "free-auto"]
    - "free-fast": ["free-coding", "free-auto"]
    - "free-auto": ["free-fast"]
    - "openrouter-qwen-coder": ["openrouter-llama-70b", "free-coding", "pollinations-qwen-coder"]
    - "openrouter-deepseek-r1": ["openrouter-qwq", "free-reasoning", "pollinations-deepseek-r1"]
    - "openrouter-llama-70b": ["openrouter-qwen-coder", "free-coding", "pollinations-qwen-coder"]
    - "openrouter-auto-free": ["free-auto", "pollinations-claude-hybrid"]

litellm_settings:
  # Drop unsupported vendor parameters gracefully
  drop_params: true
  request_timeout: 120
  telemetry: false