# Render Blueprint for LiteLLM Multi-Provider Free Proxy
# This file defines the service configuration for Render
# Secrets must be added manually in Render dashboard
# DO NOT commit actual secret values to this file

services:
  - type: web
    name: litellm-free-proxy
    runtime: docker
    plan: free
    region: oregon  # or your preferred region
    dockerfilePath: ./Dockerfile
    # Health check endpoint (no auth required)
    healthCheckPath: /health/liveliness
    # Port - Render injects PORT env var, Dockerfile uses ${PORT:-4000}
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LITELLM_TELEMETRY
        value: "false"
      # Supported Provider Keys (Add desired ones in Render Dashboard -> Environment):
      # - LITELLM_MASTER_KEY: sk-your-generated-master-key (Required)
      # - GEMINI_API_KEY: AIzaSy... (Google AI Studio)
      # - GROQ_API_KEY: gsk_... (Groq)
      # - SAMBANOVA_API_KEY: ... (SambaNova Cloud)
      # - CEREBRAS_API_KEY: csk-... (Cerebras)
      # - GITHUB_API_KEY: ghp_... (GitHub Personal Access Token)
      # - SILICONFLOW_API_KEY: sk-... (SiliconFlow Cloud)
      # - CLOUDFLARE_API_KEY: ... + CLOUDFLARE_ACCOUNT_ID: ... (Cloudflare Workers AI)
      # - HF_TOKEN: hf_... (Hugging Face Serverless)
      # - COHERE_API_KEY: ... (Cohere Developer Trial)
      # - OPENROUTER_API_KEY: sk-or-... (OpenRouter Free)
      # - MISTRAL_API_KEY: ... (Mistral AI)
      # - TOGETHERAI_API_KEY: ... (Together AI)
      # - DEEPINFRA_API_KEY: ... (DeepInfra)
      # - NEBIUS_API_KEY: ... (Nebius AI Studio)
      # - FIREWORKS_AI_API_KEY: ... (Fireworks AI)
      # - NVIDIA_API_KEY: nvapi-... (NVIDIA NIM)
    # Free tier limitations:
    # - Spins down after 15 minutes of inactivity (cold start ~30-60s)
    # - 512 MB RAM, 0.5 CPU
    # - No persistent disks, no background workers
    # - 750 hours/month free