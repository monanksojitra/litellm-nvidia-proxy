# Render Blueprint for LiteLLM Free Multi-Provider Proxy (NVIDIA NIM Primary)
# Service definition for deploying to Render Free Tier
# Set your API keys in Render Dashboard -> Environment Variables
# NEVER commit actual secret values to version control

services:
  - type: web
    name: litellm-nvidia-proxy
    runtime: docker
    plan: free
    region: oregon  # Choose your preferred Render region
    dockerfilePath: ./Dockerfile
    # Public health check endpoint (no authentication needed)
    healthCheckPath: /health/liveliness
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LITELLM_TELEMETRY
        value: "false"

      # ------------------------------------------------------------------------
      # REQUIRED CONFIGURATION:
      # ------------------------------------------------------------------------
      # - LITELLM_MASTER_KEY: sk-your-secure-custom-key (Used to authenticate Claude Code / clients)
      # - NVIDIA_API_KEY: nvapi-... (Primary Free Provider - 1,000 free credits from build.nvidia.com)

      # ------------------------------------------------------------------------
      # OPTIONAL FREE PROVIDER KEYS (Add any you want to enable extra pools/fallbacks):
      # ------------------------------------------------------------------------
      # - OPENROUTER_API_KEY: sk-or-... (OpenRouter Free Tier Models)
      # - GEMINI_API_KEY: AIzaSy... (Google AI Studio - Gemini 2.5 Flash / 15 RPM free)
      # - GROQ_API_KEY: gsk_... (Groq - Llama 3.3 70B ultra-fast 300+ tok/s)
      # - MISTRAL_API_KEY: ... (Mistral AI - Codestral 1 Billion free tokens/mo)
      # - SAMBANOVA_API_KEY: ... (SambaNova Cloud - Llama 3.1 405B & DeepSeek R1)
      # - CEREBRAS_API_KEY: csk-... (Cerebras - Llama 3.1 8B 1,000+ tok/s)
      # - GITHUB_API_KEY: ghp_... (GitHub Personal Access Token - GPT-4o & o3-mini)
      # - DEEPSEEK_API_KEY: sk-... (DeepSeek Direct API - 5M free tokens)
      # - ZHIPUAI_API_KEY: ... (Zhipu AI - GLM-4-Flash permanently free)
      # - DASHSCOPE_API_KEY: sk-... (Alibaba Cloud - Qwen 2.5 Coder 32B)
      # - SILICONFLOW_API_KEY: sk-... (SiliconFlow Cloud - DeepSeek R1 & Qwen)
      # - CLOUDFLARE_API_KEY: ... + CLOUDFLARE_ACCOUNT_ID: ... (Workers AI)